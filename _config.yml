# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# Jekyll Garden Configuration
# Optimized for actual template usage

# Preferences (controls template behavior)
preferences:
  homepage:
    enabled: true
  search:
    enabled: true
  backlinks:
    enabled: false
  pagepreview:
    enabled: true
  wiki_style_link:
    enabled: true

# Site Configuration
title: "Chico Viana"
heading: "Chico Viana"
description: "Data science and machine learning project write-ups by Chico Viana."
url: "https://vollous.github.io"
baseurl: ""

# Asset Configuration
apple_touch_icon: "/assets/img/profile.jpeg"
css_file: "/assets/css/style.css"
ie_css: "/assets/css/ie-target.css"

# Menu Items
menu:
  - title: "Projects"
    url: "/notes"

# Footer
footer:
  copyright: "© 2026 Chico Viana. Contents under CC-BY-NC"
  credits:
    enabled: true
    url: "/credits"
    text: "Credits"

# Collections
collections:
  notes:
    output: true
    permalink: /:collection/:name

# Defaults
defaults:
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "Post"
      content-type: "notes"
      feed: "show"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "Post"
      content-type: "post"
      feed: "show"
      permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Private links (for broken wiki links)
privatelinks:
  title: "Private Note"
  msg: "This note hasn't been published yet."

# Math rendering
# Kramdown emits \( \) / \[ \] for $$...$$ math; single $...$ and final
# rendering are handled client-side by MathJax 3 (see _layouts/Post.html).
mathjax: true
markdown: kramdown
kramdown:
  math_engine: mathjax



# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - Dockerfile
  - docker-compose.yml
  - blog.code-workspace
  - mise.toml
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/